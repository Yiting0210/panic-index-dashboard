# Strategy-consistency evaluation set. Each fixture is a real date whose
# standard backtest (QQQ, default strategy, start 2021-05-17, Panic Index
# recomputed point-in-time as of that date) lands in one position scenario.
# `expect` pins the code-computed signal, so a data or rule change that moves
# it fails CI.
#
# `probes` are hand-written answers for the offline validator check:
# `consistent` must pass, every other probe must be rejected; the
# `current_equals_*` probes state a current exposure equal to another
# strategy field (#18). Live runs (--mode record/live) ask `question` and
# count validator violations.
fixtures:
  - id: c01_full_exposure
    market: QQQ
    as_of: 2026-10-22
    question: What exposure does the strategy hold right now, and why?
    expect: {regime: neutral, final_position_pct: 100.0, action: hold}
    probes:
      consistent: >-
        The strategy currently holds 100% exposure. The Panic Index is 49.0, in the
        neutral regime, so the rule makes no change. If the index closes above 64, the
        rule would add 20% exposure, but it is already at the 100% cap.
      fabricated_position: >-
        With sentiment in the middle of its range, the framework suggests 60% exposure,
        or 6 out of 10 units.
      contradictory_direction: >-
        The rule is currently adding exposure because sentiment is improving.

  - id: c02_eighty_pct
    market: QQQ
    as_of: 2025-03-03
    question: Is the current regime historically attractive for adding exposure?
    expect: {regime: panic, final_position_pct: 80.0, action: add}
    probes:
      consistent: >-
        The Panic Index is 64.3, just above the 64 panic threshold, so the rule added
        20% exposure on the latest observation and now holds 80% exposure, or 8 out of
        10 units.
      fabricated_position: >-
        Given the panic reading, the strategy now holds 65% exposure.
      contradictory_direction: >-
        Because the market is in panic, the rule is now reducing exposure.
      # #18: a fabricated current exposure equal to another strategy field.
      current_equals_add_step: >-
        The strategy currently holds 20% exposure.

  - id: c03_after_reduction
    market: QQQ
    as_of: 2024-06-28
    question: What would make the rule add or reduce exposure from here?
    expect: {regime: neutral, final_position_pct: 0.0, action: hold}
    probes:
      consistent: >-
        Exposure was reduced to 0% during the June 2023 greed regime and the strategy
        currently holds 0% exposure in a neutral regime. It would add 20% per day only
        if the Panic Index closes above 64.
      fabricated_position: >-
        The strategy is currently 35% invested while it waits for a panic signal.
      contradictory_direction: >-
        The framework is buying back exposure today as sentiment normalizes.

  - id: c04_panic_add
    market: QQQ
    as_of: 2024-08-05
    question: What exposure does the strategy hold right now, and why?
    expect: {regime: panic, final_position_pct: 20.0, action: add}
    probes:
      consistent: >-
        The Panic Index closed at 83.5, above the 64 threshold, so the rule added 20%
        and now holds 20% exposure.
      fabricated_position: >-
        After the panic reading the rule now holds 40% exposure.
      contradictory_direction: >-
        The strategy is currently trimming exposure because the market is in panic.
      current_equals_cap: >-
        The current position is 100%.

  - id: c05_greed_reduce
    market: QQQ
    as_of: 2023-06-13
    question: What would make the rule add or reduce exposure from here?
    expect: {regime: greed, final_position_pct: 30.0, action: reduce}
    probes:
      consistent: >-
        The Panic Index fell to 12.3, below 15, so the rule reduced exposure by 10% and
        currently holds 30% exposure.
      fabricated_position: >-
        The strategy currently holds 75% exposure.
      contradictory_direction: >-
        Greed is high, so the rule is now adding exposure to ride the momentum.
      current_equals_reduce_step: >-
        The current exposure is 10%.

  # Cap / floor boundaries (#19): a step that lands exactly on the cap or floor
  # is still an add or reduce; only an unchanged position is a hold.
  - id: c06_add_into_cap
    market: QQQ
    as_of: 2025-03-04
    question: What exposure does the strategy hold right now, and why?
    expect: {regime: panic, final_position_pct: 100.0, action: add}
    probes:
      consistent: >-
        The Panic Index closed at 66.3, above the 64 threshold, so the rule added 20%
        exposure on the latest observation and now holds 100% exposure, the cap.
      fabricated_position: >-
        After the panic reading the strategy now holds 90% exposure.
      contradictory_direction: >-
        The strategy is now reducing exposure as the panic deepens.

  - id: c07_add_clipped_at_cap
    market: QQQ
    as_of: 2021-11-26
    question: What exposure does the strategy hold right now, and why?
    expect: {regime: panic, final_position_pct: 100.0, action: add}
    probes:
      consistent: >-
        The Panic Index closed at 84.4, in the panic regime. The step was clipped at the
        cap, so the rule added only 10% and now holds 100% exposure.
      fabricated_position: >-
        The rule now holds 120% exposure after the panic reading.
      contradictory_direction: >-
        The framework is currently trimming exposure because of the panic.

  - id: c08_hold_at_cap
    market: QQQ
    as_of: 2025-03-06
    question: Is the current regime historically attractive for adding exposure?
    expect: {regime: panic, final_position_pct: 100.0, action: hold}
    probes:
      consistent: >-
        The Panic Index is 65.8, in the panic regime, but the strategy already holds
        100% exposure at the cap, so it makes no change today.
      fabricated_position: >-
        The strategy currently holds 70% exposure while panic persists.
      contradictory_direction: >-
        The rule is adding exposure now because of the panic reading.

  - id: c09_reduce_into_floor
    market: QQQ
    as_of: 2023-06-16
    question: What would make the rule add or reduce exposure from here?
    expect: {regime: greed, final_position_pct: 0.0, action: reduce}
    probes:
      consistent: >-
        The Panic Index fell to 9.4, below 15, so the rule reduced exposure by 10% and
        currently holds 0% exposure, the floor.
      fabricated_position: >-
        The strategy currently holds 25% exposure.
      contradictory_direction: >-
        Greed is extreme, so the rule is now adding exposure.

  - id: c10_hold_at_floor
    market: QQQ
    as_of: 2023-06-20
    question: What would make the rule add or reduce exposure from here?
    expect: {regime: greed, final_position_pct: 0.0, action: hold}
    probes:
      consistent: >-
        The Panic Index is 10.7, in the greed regime, but the strategy currently holds 0%
        exposure at the floor, so it makes no change today.
      fabricated_position: >-
        The strategy currently holds 35% exposure.
      contradictory_direction: >-
        The rule is currently reducing exposure further.
      current_equals_initial: >-
        The strategy currently holds 50% exposure.
