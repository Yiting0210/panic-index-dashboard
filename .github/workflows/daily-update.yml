name: Daily data update

# 05:00 UTC Tuesday-Saturday is 01:00 New York time (EDT) or 00:00 (EST), so
# each run picks up the previous weekday's session hours after the close,
# once every source has published final closes. Saturday's run covers Friday.
# A session that is still incomplete is retried on the next run.
# Scheduled workflows only run from the default branch.
on:
  schedule:
    - cron: "0 5 * * 2-6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-data-update
  cancel-in-progress: false

env:
  FASTEMBED_CACHE_PATH: /home/runner/.cache/fastembed

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/fastembed
          key: fastembed-${{ hashFiles('data/fomc/index/manifest.json') }}

      - name: Fetch market data and FOMC documents
        run: python scripts/daily_update.py --summary logs/daily_update.json

      - name: Run tests against the updated data
        run: python -m pytest -q

      - name: Write job summary
        if: always()
        run: |
          if [ -f logs/daily_update.json ]; then
            { echo '```json'; cat logs/daily_update.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            # Surface data warnings as annotations on the run page.
            python -c "import json; [print('::warning title=Market data::' + w) for w in json.load(open('logs/daily_update.json'))['market_data']['warnings']]"
          fi

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add data/market_data_clean.csv data/fomc
          if git diff --cached --quiet; then
            echo "No new data (market holiday or nothing published)."
            exit 0
          fi
          git commit -m "data: daily update $(date -u +%Y-%m-%d)"
          git push
