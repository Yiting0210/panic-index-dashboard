name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      live_agent_eval:
        description: "Run the agent eval against the real Claude API (uses ANTHROPIC_API_KEY)"
        type: boolean
        default: false

env:
  FASTEMBED_CACHE_PATH: /home/runner/.cache/fastembed

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then python -m pip install -r requirements-dev.txt; fi

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/fastembed
          key: fastembed-${{ hashFiles('data/fomc/index/manifest.json') }}

      - name: Compile Streamlit entry points and MCP server
        run: |
          python -m py_compile Home.py
          python -m py_compile "pages/1_💠_Threshold_Strategy.py"
          python -m py_compile "pages/2_🏔️_Peak_Detection.py"
          python -m py_compile "pages/3_🤖_Research_Assistant.py"
          python -m py_compile mcp_server.py

      - name: Run tests (unit, point-in-time leakage, retrieval eval, agent replay)
        run: python -m pytest -q

      - name: Retrieval eval report
        run: python -m evals.retrieval_eval

      - name: Strategy-consistency eval report (offline)
        run: python -m evals.consistency_eval

      - name: Upload eval results
        uses: actions/upload-artifact@v4
        with:
          name: offline-evals
          path: |
            evals/results/retrieval.json
            evals/results/consistency_offline.json

  live-agent-eval:
    if: github.event_name == 'workflow_dispatch' && inputs.live_agent_eval
    needs: test
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: python -m pip install -r requirements.txt

      - uses: actions/cache@v4
        with:
          path: /home/runner/.cache/fastembed
          key: fastembed-${{ hashFiles('data/fomc/index/manifest.json') }}

      - name: Run agent eval against the Claude API and record responses
        run: python -m evals.agent_eval --mode record

      - name: Run strategy-consistency eval against the Claude API
        run: python -m evals.consistency_eval --mode record --provider anthropic

      - name: Upload agent eval results and recordings
        uses: actions/upload-artifact@v4
        with:
          name: agent-eval
          path: |
            evals/results/agent.json
            evals/results/consistency_anthropic.json
            evals/results/agent_usage.jsonl
            evals/recordings/
